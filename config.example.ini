# Copy this file to config.ini. Do not put real credentials in this example.
# Values are literal: do not wrap passwords in quotes.
[smtp]
host = smtp.example.com
port = 465
# ssl (usually 465) or starttls (usually 587).
# none is allowed only with 127.0.0.1 / ::1, without authentication.
security = ssl
username = sender@example.com
# Prefer the SMTP_PASSWORD environment variable, or set the password locally here.
password =
timeout_seconds = 30

[mail]
from = sender@example.com
# One or more plain email addresses, separated by commas.
to = recipient@example.com
subject = Daily demo report
